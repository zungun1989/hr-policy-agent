name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "42"
      CHROMA_DB_PATH: "./rag/chroma_store"
      CORPUS_PATH: "./corpus"
      MOCK_DATA_PATH: "./mock_data"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build/import check — RAG ingestion
        run: python rag/ingest.py

      - name: Smoke test — app starts and /health responds
        run: pytest tests/test_app_start.py -v

      - name: MCP tool discovery and unit tests
        run: pytest tests/test_mcp_tools.py -v
